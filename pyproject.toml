[project]
name = "radar-papers-mcp"
version = "0.1.0"
description = "Servidor MCP que monitora PubMed e medRxiv por tópicos de pesquisa e resume papers com LLM local"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "duckdb>=1.1",
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
radar-papers-mcp = "radar_papers_mcp.mcp_server.server:main"
papers-cli = "radar_papers_mcp.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8", "mypy>=1.13", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_papers_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/radar_papers_mcp/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
